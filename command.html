<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23030712'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%233b6cff' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23dbeaff'/%3E%3Cpath d='M16 4 v4' stroke='%237aa0ff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Praxis · Command Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var _ccErr = function (msg, stack) {
        document.getElementById('root').innerHTML = '';
        document.body.style.cssText = 'margin:0;background:#030712;color:#eaf2ff;padding:28px;font-family:monospace;font-size:13px;';
        document.body.innerHTML =
          '<h2 style="margin:0 0 12px;color:#3b6cff;font-size:16px">Command Center — load error</h2>' +
          '<pre style="margin:0;white-space:pre-wrap;word-break:break-all;opacity:.85">' + (stack || msg) + '</pre>';
      };
      window.onerror = function (msg, src, line, col, err) { _ccErr(msg, err && err.stack); };
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason; _ccErr(String(r), r && r.stack);
      });
    </script>
    <script type="module" src="/src/command/main.tsx"></script>
  </body>
</html>
