<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas voice state</title>
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
      body { font-family: "Segoe UI", system-ui, sans-serif; }
      /* The native window supplies the desktop margin; preserve the pill's own styles. */
      #root .vsi-root { bottom: 0; right: 0; max-width: 100%; }
      /* Over OTHER apps backdrop-filter has nothing to blur (it only sees this transparent
         page), so the in-app 82% glass let the window underneath read straight through the
         label. Opaque enough to read over anything; the hint and notices get a backing too. */
      #root .vsi-pill { background: rgba(6, 9, 18, 0.96); }
      #root .vsi-hint {
        padding: 2px 9px;
        border-radius: 999px;
        background: rgba(6, 9, 18, 0.9);
        color: rgba(220, 232, 255, 0.6);
      }
      #root .vsi-notice { background: rgba(30, 14, 16, 0.95); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/voicepill/main.tsx"></script>
  </body>
</html>
